# Orbit iOS, generated by XcodeGen (`xcodegen generate` in this directory).
#
# The .xcodeproj is committed too, so nobody needs XcodeGen to open the app.
# This file exists so the project can be rebuilt identically instead of
# re-clicked through the wizard, and so a build setting change is reviewable
# in a diff rather than buried in a 900-line pbxproj.
#
# Sources are referenced in place ("Copy items if needed" OFF) and grouped by
# folder, so git keeps tracking Theme/, Models/, Today/ and Components/ where
# they already are.
name: Orbit

options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    # Swift 5 language mode. The client was written against iOS 17 and Swift 5
    # concurrency rules; Swift 6 mode is a separate piece of work, not a build
    # fix. See DECISIONS.md, 19 Sept.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # The one place the server URL is set. Override per build without touching
    # the plist: `xcodebuild ORBIT_API_BASE=https://orbit.vercel.app ...`
    ORBIT_API_BASE: https://resolutions-exhibitions-rendered-ambient.trycloudflare.com

packages:
  # Voice. The only third-party package in the app; networking is still
  # URLSession. It pulls LiveKit, which is what carries the WebRTC audio.
  # See DECISIONS.md, 19 Sept.
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    from: "3.3.1"

targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Theme
      - path: Components
      - path: Today
      - path: Voice
        # The folder carries its own README. Globbing the directory was
        # bundling it into Orbit.app.
        excludes:
          - "README.md"
      - path: OrbitAPI.swift
      - path: OrbitAPI+Today.swift
      - path: OrbitAPI+Voice.swift
      - path: OrbitAPI+Settings.swift
      - path: JourneyMapView.swift
    dependencies:
      - package: ElevenLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.OrbitHacks
        PRODUCT_NAME: Orbit
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set in Xcode on the Mac that runs the demo, and kept here so
        # `xcodegen generate` cannot quietly throw it away again. A different
        # team just changes this line. Simulator builds do not sign at all --
        # the CLI passes CODE_SIGNING_ALLOWED=NO -- so this only matters for a
        # real iPhone, which is exactly when you want it to be right.
        DEVELOPMENT_TEAM: K9TDRPCGUS
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Read by OrbitAPI.base. Set the value in the ORBIT_API_BASE build
        # setting above, not here.
        ORBIT_API_BASE: $(ORBIT_API_BASE)
        NSLocationWhenInUseUsageDescription: Orbit uses your location to tell you when to leave for the bus.
        NSMicrophoneUsageDescription: Orbit listens only while you hold the talk button, so you can tell it what you finished without typing.
        # LiveKit probes the local network to find the fastest audio path.
        NSLocalNetworkUsageDescription: Orbit uses the local network to keep the voice call clear.
        # The server is HTTPS. Only plain-HTTP localhost is still allowed,
        # for a dev server on the same Mac; arbitrary loads are off.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  OrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Orbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.OrbitHacksUITests
        TEST_TARGET_NAME: Orbit
        DEVELOPMENT_TEAM: K9TDRPCGUS

schemes:
  Orbit:
    build:
      targets:
        Orbit: all
        OrbitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrbitUITests
